<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Sea of Conquest - Alliance Command</title><style>:root {--primary: #c6a256; --bg: #0a0e14; --panel: #161c24; --text: #e0e0e0; --accent: #2d5a80;} body {font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0;} .navbar {background: var(--panel); padding: 1rem; display: flex; gap: 1rem; border-bottom: 2px solid var(--primary); align-items: center;} .card {background: var(--panel); border-radius: 8px; padding: 1.5rem; margin: 1rem; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3);} .btn {background: var(--primary); color: #000; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.2s;} .btn:hover {opacity: 0.8;} .hidden {display: none;} table {width: 100%; border-collapse: collapse; margin-top: 1rem;} th, td {padding: 12px; border-bottom: 1px solid #333; text-align: left;} .ai-box {position: fixed; bottom: 20px; right: 20px; width: 320px; background: var(--panel); border: 2px solid var(--primary); border-radius: 10px; padding: 1rem; box-shadow: 0 10px 20px rgba(0,0,0,0.5);} input {width: 100%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;} #auth {display: flex; height: 100vh; justify-content: center; align-items: center;} .action-btns {display: flex; gap: 10px;}</style></head><body><div id='auth'><div class='card' style='width: 300px;'><h2>Access Alliance Command</h2><input type='password' id='pin' placeholder='Enter 4-digit PIN'><button class='btn' onclick='checkAuth()' style='width: 100%;'>Unlock Terminal</button></div></div><div id='app' class='hidden'><nav class='navbar'><div><b>[The Black Sails]</b></div><button class='btn' onclick='showTab("dashboard")'>Dashboard</button><button class='btn' onclick='showTab("roster")'>Roster</button><button class='btn' onclick='showTab("events")'>Events</button></nav><main id='main-content'><div id='dashboard'><h2>Command Overview</h2><div class='card'><p><b>Alliance Power:</b> <span id='total-power'>0</span></p><p><b>Active Members:</b> <span id='count'>0</span></p><p><b>Last Deployment:</b> Kraken Hunt (Success)</p></div></div><div id='roster' class='hidden'><h2>Member Roster</h2><button class='btn' onclick='addMember()'>+ Add Member</button><table id='roster-table'><thead><tr><th>Name</th><th>Power</th><th>Role</th><th>Action</th></tr></thead><tbody id='roster-body'></tbody></table></div><div id='events' class='hidden'><h2>Event Schedule</h2><div class='card'><h3>Kraken Hunt</h3><p>Time: 20:00 UTC</p><button class='btn' onclick='alert("Registered!")'>Sign Up</button></div></div></main></div><div class='ai-box'><h3>Alliance AI Assistant</h3><input type='text' id='ai-input' placeholder='Strategy request...' onkeypress='handleAi(event)'><div id='ai-resp' style='font-size: 0.9rem; color: var(--primary);'></div></div><script>function checkAuth(){if(document.getElementById('pin').value === '1234') { document.getElementById('auth').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); render(); } else { alert('Incorrect PIN'); }} function showTab(tabId){ document.querySelectorAll('#main-content > div').forEach(d => d.classList.add('hidden')); document.getElementById(tabId).classList.remove('hidden'); } let members = JSON.parse(localStorage.getItem('roster') || '[]'); function render(){ const tbody = document.getElementById('roster-body'); let totalP = 0; tbody.innerHTML = members.map((m, idx) => { totalP += parseInt(m.power) || 0; return `<tr><td>${m.name}</td><td>${m.power}</td><td>${m.role}</td><td><button class="btn" onclick="removeMember(${idx})">X</button></td></tr>`; }).join(''); document.getElementById('count').innerText = members.length; document.getElementById('total-power').innerText = totalP.toLocaleString(); localStorage.setItem('roster', JSON.stringify(members)); } function addMember(){ const name = prompt('Name:'); const power = prompt('Power:'); if(name && power) { members.push({name, power, role: 'Member'}); render(); } } function removeMember(idx){ members.splice(idx, 1); render(); } function handleAi(e){ if(e.key === 'Enter'){ const val = e.target.value; document.getElementById('ai-resp').innerText = 'AI Analysis for "' + val + '": Prioritize resource farming and ship repair before the next event.'; e.target.value = ''; } } </script></body></html>
